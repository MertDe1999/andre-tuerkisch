name: Mathegarten checks
on:
  push:
    branches: [main]
    paths: ['mathegarten/**', '.github/workflows/mathegarten.yml']
  pull_request:
    paths: ['mathegarten/**', '.github/workflows/mathegarten.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node mathegarten/tests.mjs
      - run: node mathegarten/cloud-tests.mjs
