name: Lernspiel-Tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lernlogik und Bedienung prüfen
        run: node --test tests/sentence-builder.test.cjs tests/learning-controls.test.cjs
